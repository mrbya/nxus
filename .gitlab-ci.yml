image: registry.gitlab.com/byacrates/nxus:latest

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: $CI_COMMIT_BRANCH == "master"
    - if: '$CI_COMMIT_TAG'

stages:
  - test
  - build
  - release

cache:
  key:
  paths:
    - ~/.cargo/registry/
    - ~/.cargo/git/

test:
  stage: test
  script:
    - echo "Running tests..."
    - just ci
    - awk '/^TOTAL / { print "LINES_COVERAGE " $10 }' coverage/coverage.txt
  coverage: '/LINES_COVERAGE\s+(\d+(?:\.\d+)?)%/'
  artifacts:
    paths:
      - coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura.xml

build:
  stage: build
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - just build
  artifacts:
    name: "nxus-$CI_COMMIT_SHORT_SHA"
    paths:
      - target/release/nxus
    expire_in: 7 days

upload-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: '$CI_COMMIT_TAG'
  needs:
    - job: build
      artifacts: true
  script:
    - mkdir -p release-assets
    - cp target/release/nxus release-assets/nxus
  artifacts:
    name: "release-assets-$CI_COMMIT_TAG"
    paths:
      - release-assets/nxus
    expire_in: never
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "Release $CI_COMMIT_TAG"
    description: "Automated release for ${CI_COMMIT_TAG}"
    assets:
      links:
        - name: nxus (linux)
          url: "$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/file/release-assets/nxus"
          filepath: "/binaries/nxus"
