[workspace]
members = [
    "./",
    "crates/nxus-shell",
    "crates/nxus-core",
]
resolver = "2"

[workspace.package]
authors                 = ["mrbya <v.toth.svk2@gmail.com>"]
description             = "NuttX CLI companion"
edition                 = "2024"
rust-version            = "1.85.0"
homepage                = "{TODO: add project repo}"
repository              = "{TODO: add project repo}"
license                 = "MIT OR Apache-2.0"
keywords                = ["nxus", "cli"]
categories              = ["command-line-utilities"]
version                 = "0.0.1"

[package]
name                    = "nxus"
authors.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
homepage.workspace      = true
repository.workspace    = true
license.workspace       = true
keywords.workspace      = true
categories.workspace    = true
description.workspace   = true
version.workspace       = true
publish                 = true

[workspace.dependencies]
# nxus crates
nxus-shell  = { path = "crates/nxus-shell" }
nxus-core   = { path = "crates/nxus-core" }
# Other workspace deps
clap                    = { version = "4", features = ["derive"] }
criterion               = { version = "0.8" }
pretty_assertions       = { version = "1" }
assert_cmd              = { version = "2" }
predicates              = { version = "3" }

[dependencies]
nxus-shell.workspace = true

[dev-dependencies]
criterion.workspace = true
pretty_assertions.workspace = true
assert_cmd.workspace = true
predicates.workspace = true

[features]
default = []
full = []

# [lib]
# bench = false

[[bin]]
name = "nxus"
path = "src/main.rs"
bench = false

[[bench]]
name = "benches"
harness = false
required-features = ["full"]

[package.metadata.cargo-udeps.ignore]
normal = [
    "nxus",
]
development = ["criterion", "pretty_assertions"]

[package.metadata.playground]
features = ["full"]

[profile.release]
codegen-units = 1
incremental = false

[profile.bench]
codegen-units = 1
incremental = false
