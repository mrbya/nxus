[workspace]
members = [
    "./",
    "crates/nxus-shell",
    "crates/nxus-core",
]
resolver = "2"

[workspace.package]
authors                 = ["mrbya <v.toth.svk2@gmail.com>"]
description             = "NuttX CLI companion"
edition                 = "2024"
rust-version            = "1.85.0"
homepage                = "https://gitlab.com/byacrates/nxus"
repository              = "https://gitlab.com/byacrates/nxus"
license                 = "MIT OR Apache-2.0"
keywords                = ["nxus", "cli"]
categories              = ["command-line-utilities"]
version                 = "1.0.0"

[package]
name                    = "nxus"
authors.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
homepage.workspace      = true
repository.workspace    = true
license.workspace       = true
keywords.workspace      = true
categories.workspace    = true
description.workspace   = true
version.workspace       = true
publish                 = true

[workspace.dependencies]
# nxus crates
nxus-shell  = { path = "crates/nxus-shell", version = "1.0.0"}
nxus-core   = { path = "crates/nxus-core", version = "1.0.0"}
# Other runtime deps
clap                    = { version = "4", features = ["derive"] }
thiserror               = { version = "2" }
termcolor               = { version = "1.4.1" }
spinners                = { version = "4.1.1" }
serde                   = { version = "1", default-features = false, features = ["serde_derive"] }
toml                    = { version = "1.0.3", features = ["preserve_order"] }
toml_edit               = { version = "0.25", features = ["parse"] }
indexmap                = { version = "2.14", features = ["serde"] }
symlink                 = { version = "0.1" }
zappy-core              = { version = "0.1" }
zappy-fs                = { version = "0.1" }
include_dir             = { version = "0.7" }
chrono                  = { version = "0.4" }
tempfile                = { version = "3" }
# Dev deps
criterion               = { version = "0.8" }
pretty_assertions       = { version = "1" }
assert_cmd              = { version = "2" }
predicates              = { version = "3" }

[dependencies]
nxus-shell.workspace = true

[dev-dependencies]
criterion.workspace = true
pretty_assertions.workspace = true
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true

[features]
default = ["spinners"]
full = ["spinners"]
spinners = []

# [lib]
# bench = false

[[bin]]
name = "nxus"
path = "src/main.rs"
bench = false

[[bench]]
name = "benches"
harness = false
required-features = ["full"]

[package.metadata.cargo-udeps.ignore]
normal = [
    "nxus",
]
development = ["criterion", "pretty_assertions", "assert_cmd", "predicates"]

[package.metadata.playground]
features = ["full"]

[profile.release]
codegen-units = 1
incremental = false

[profile.bench]
codegen-units = 1
incremental = false
