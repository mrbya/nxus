# Global project config.
[project]
default_profile = "sim"

# Build dir config.
[build]
root = "build"
link_compile_commands = true

# Project-local `NuttX` workspace config.
# Pin the `nuttx` and `nuttx_apps` revisions to the baseline you need.
[workspace]
root = "workspace"

[workspace.nuttx]
# src = "https://github.com/apache/nuttx.git"
rev = "master"

[workspace.nuttx_apps]
# src = "https://github.com/apache/nuttx-apps.git"
rev = "master"

# Sim profile overrides.
# [profile.sim]
# arch = "sim"
# family = "sim"
# board = "sim"
# config_base = "nsh"

# Test profile overrides.
# [profile.test]
# arch = "sim"
# family = "sim"
# board = "sim"
# config_base = "nsh"

# Custom profile definitions
[profile.prod]
arch = "arm"
family = "stm32f7"
board = "nucleo-f767zi"
config_base = "evalos"
flash = {
    command = "openocd",
    args = ["-f", "board/st_nucleo_f7.cfg", "-c", "program {elf} verify reset exit"],
}

# Custom project commands.
#
# Run with:
#   nxus exec <command>
#
# List available commands with:
#   nxus exec list

# Build API documentation and the MkDocs site.
[command.docs]
command = "sh"
args = ["-c", "doxide build && mkdocs build"]

# Serve the MkDocs site locally.
[command.docs-serve]
command = "mkdocs"
args = ["serve"]

# Format C and C++ sources.
[command.fmt]
command = "sh"
args = [
    "-c",
    "find app -type f \\( -name '*.cpp' -o -name '*.hpp' \\) -print0 | xargs -0 clang-format --dry-run --Werror",
]

# Check C and C++ source formatting.
[command.fmt-check]
command = "sh"
args = [
    "-c",
    "find app lib -type f \\( -name '*.cpp' -o -name '*.hpp' \\) -print0 | xargs -0 clang-format --dry-run --Werror"
]

# Run clang-tidy checks for the project sources.
[command.check]
command = "sh"
args = [
    "-c",
    "run-clang-tidy -p \"{build_dir}\" -warnings-as-errors=\"*\" -quiet -header-filter=\"^$PWD/(app)/.*\" $(find app lib -type f -name '*.cpp' -print)"
]
