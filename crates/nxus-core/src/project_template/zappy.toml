# Template metadata.
[template]
id = "nxus"
name = "nxus-nuttx-project"
description = "Opinionated `NuttX` app managed by nxus"
language = "cpp"
version = "0.1.0"

# Template source directory.
[template.source]
root = "template"

# Template variable definitions.
