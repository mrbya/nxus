# Template file path config.
[paths]
exclude = [".git", ".DS_Store", "target", "build", "workspace", "public"]
binary_extensions = ["png", "jpg", "jpeg", "gif", "ico", "pdf", "zip", "js", "mjs", "html", "css"]
binary_files = []

